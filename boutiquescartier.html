    <style>
        /* --- DESIGN SYSTEM --- */
        :root {
            --cartier-red: #7d1d26;
            --cartier-bg: #ffffff;
            --text-main: #111111;
            --text-light: #767676;
            --border-color: #e5e5e5;
            --font-serif: 'Playfair Display', serif; 
            --font-sans: 'Lato', sans-serif;
        }

        html, body { 
            margin: 0; padding: 0; 
            width: 100%; height: 100%; 
            background-color: var(--cartier-bg); 
            font-family: var(--font-sans); 
            color: var(--text-main);
            overflow: hidden; 
            display: flex; 
        }

        /* --- SIDEBAR --- */
        #sidebar {
            width: 360px;
            min-width: 360px;
            background: #fff;
            border-right: 1px solid var(--border-color);
            display: flex;
            flex-direction: column;
            z-index: 20;
            height: 100vh;
            box-shadow: 2px 0 15px rgba(0,0,0,0.03);
        }

        .header {
            padding: 30px 20px 20px;
            background: #fff;
            text-align: center;
            border-bottom: 3px solid var(--cartier-red);
        }
        
        #logo-img {
            display: block; margin: 0 auto;
            max-width: 160px; height: auto;
        }
        
        .subtitle {
            font-family: var(--font-serif);
            font-style: italic;
            color: var(--cartier-red);
            font-size: 1.1em;
            margin-top: 15px;
            letter-spacing: 1px;
        }

        #list-container {
            flex: 1;
            overflow-y: auto;
            background: #fff;
            position: relative;
            scroll-behavior: smooth;
        }
        #list-container::-webkit-scrollbar { width: 4px; }
        #list-container::-webkit-scrollbar-thumb { background: #ccc; border-radius:2px; }

        /* ITEM LISTE */
        .shop-item {
            padding: 18px 24px;
            border-bottom: 1px solid #f0f0f0;
            cursor: pointer;
            display: flex; 
            justify-content: space-between; 
            align-items: center;
            transition: all 0.3s ease;
        }
        .shop-item:hover { background: #fafafa; padding-left: 28px; }
        .shop-item.active { background: #fffbfb; border-left: 4px solid var(--cartier-red); padding-left: 24px; }
        .shop-item.active .si-timer { color: var(--cartier-red); font-weight: 600; }

        .si-info { display: flex; flex-direction: column; }
        .si-country { font-size: 0.7em; color: #999; font-weight: 700; text-transform: uppercase; margin-bottom: 4px; letter-spacing: 1.5px; }
        .si-name { font-family: var(--font-serif); font-size: 1.2em; color: #000; }
        .si-status { text-align: right; }
        .si-time { font-family: var(--font-sans); font-weight: 300; font-size: 1.2em; color: #333; margin-bottom: 2px; }
        .si-timer { font-size: 0.75em; color: #aaa; margin-bottom: 6px; font-style: italic; font-family: var(--font-serif); }
        
        .badge {
            display: inline-block; padding: 4px 8px; border-radius: 0;
            font-size: 0.65em; font-weight: 700; text-transform: uppercase; letter-spacing: 1px;
            border: 1px solid transparent;
        }
        .b-open { color: var(--cartier-red); border: 1px solid var(--cartier-red); background: #fff; }
        .b-closed { color: #1e8e3e; background: #f4fbf6; border: 1px solid #d4edda; }

        /* --- GLOBE AREA --- */
        #globe-area {
            flex-grow: 1;
            position: relative;
            background: #ffffff; /* FOND BLANC */
            width: 100%;
            overflow: hidden;
        }

        #utc-clock {
            position: absolute; top: 30px; right: 30px;
            color: #333; font-family: var(--font-serif); font-size: 1.5em; 
            z-index: 50; background: rgba(255,255,255,0.95);
            padding: 12px 25px; border: 1px solid #ddd;
            box-shadow: 0 5px 15px rgba(0,0,0,0.1);
        }
        
        #loading-msg {
            position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%);
            color: #aaa; font-family: var(--font-sans); pointer-events: none; letter-spacing: 2px;
        }

        #copyright {
            position: absolute; bottom: 15px; right: 20px;
            color: #aaa; font-size: 0.7em; pointer-events: none; z-index: 50;
            font-family: var(--font-sans); letter-spacing: 1px;
        }

        /* --- TOOLTIP PREMIUM --- */
        #custom-tooltip {
            position: absolute;
            display: none;
            background: #fff;
            border-left: 3px solid var(--cartier-red);
            padding: 15px 20px;
            pointer-events: none;
            z-index: 100;
            color: #333;
            box-shadow: 0 10px 30px rgba(0,0,0,0.15);
            font-family: var(--font-sans);
            min-width: 150px;
        }
        #custom-tooltip h3 {
            margin: 0 0 5px 0;
            font-family: var(--font-serif);
            font-size: 1.1em;
            color: #000;
        }
        #custom-tooltip .tt-meta { font-size: 0.8em; color: #888; text-transform: uppercase; margin-bottom: 8px; }
        #custom-tooltip .tt-status { font-weight: bold; font-size: 0.85em; }
    </style>
</head>

    const fixedHolidays = ["01/01", "01/05", "25/12"];

    // --- 2. CALCUL DES STATUTS ---
    function getStatus(shop) {
        try {
            const now = new Date();
            const localDateString = now.toLocaleString("en-US", {timeZone: shop.tz});
            const localDate = new Date(localDateString);
            
            const day = localDate.getDay(); 
            const h = localDate.getHours() + (localDate.getMinutes() / 60);
            
            // Vérification jour férié
            const dayMonth = String(localDate.getDate()).padStart(2,'0') + "/" + String(localDate.getMonth() + 1).padStart(2,'0');
            const isHoliday = fixedHolidays.includes(dayMonth);

            const isOff = shop.daysOff.includes(day) || isHoliday;
            const isOpen = !isOff && h >= shop.open && h < shop.close;

            const hh = String(localDate.getHours()).padStart(2,'0');
            const mm = String(localDate.getMinutes()).padStart(2,'0');

            // --- TIMER ---
            let diffMinutes = 0;
            let label = "";

            if (isOpen) {
                label = "Ferme dans";
                diffMinutes = (shop.close - h) * 60;
            } else {
                label = "Ouvre dans";
                if (!isOff && h < shop.open) {
                    diffMinutes = (shop.open - h) * 60;
                } else {
                    // Recherche du prochain jour d'ouverture
                    let daysToAdd = 1;
                    let nextDate = new Date(localDate);
                    nextDate.setDate(localDate.getDate() + 1);
                    
                    let loopLimit = 0;
                    while (loopLimit < 14) { 
                        let checkDay = nextDate.getDay();
                        let checkDateStr = String(nextDate.getDate()).padStart(2,'0') + "/" + String(nextDate.getMonth()+1).padStart(2,'0');
                        
                        if (!shop.daysOff.includes(checkDay) && !fixedHolidays.includes(checkDateStr)) {
                            break; 
                        }
                        daysToAdd++;
                        nextDate.setDate(nextDate.getDate() + 1);
                        loopLimit++;
                    }

                    let minutesUntilMidnight = (24 - h) * 60;
                    let minutesFullDays = (daysToAdd - 1) * 24 * 60;
                    let minutesFromMidnightToOpen = shop.open * 60;
                    diffMinutes = minutesUntilMidnight + minutesFullDays + minutesFromMidnightToOpen;
                }
            }

            const timerH = Math.floor(diffMinutes / 60); 
            const timerM = Math.floor(diffMinutes % 60);
            const timerString = `${timerH}h ${String(timerM).padStart(2, '0')}`;

            return {
                isOpen: isOpen,
                text: isOpen ? "OUVERT" : "FERMÉ",
                class: isOpen ? "b-open" : "b-closed",
                color: isOpen ? "#7d1d26" : "#1e8e3e",
                time: `${hh}:${mm}`,
                timerLabel: label,
                timerVal: timerString
            };

        } catch (e) {
            return { isOpen: false, text: "ERR", class: "b-closed", color: "grey", time: "--:--", timerLabel: "-", timerVal: "" };
        }
    }

    // --- 3. AFFICHAGE LISTE ---
    function renderList() {
        const container = document.getElementById('list-container');
        if(!container) return;
        container.innerHTML = "";
        
        shops.forEach(shop => {
            const st = getStatus(shop);
            const div = document.createElement('div');
            div.className = "shop-item";
            div.id = `item-${shop.id}`; 
            
            div.onclick = function() { window.activateShop(shop.id); };

            div.innerHTML = `
                <div class="si-info">
                    <span class="si-country">${shop.country}</span>
                    <span class="si-name">${shop.name}</span>
                </div>
                <div class="si-status">
                    <div class="si-time">${st.time}</div>
                    <div class="si-timer">${st.timerLabel} ${st.timerVal}</div>
                    <div class="badge ${st.class}">${st.text}</div>
                </div>
            `;
            container.appendChild(div);
        });
    }

    // --- 4. ACTIVATION ---
    window.activateShop = function(id) {
        document.querySelectorAll('.shop-item').forEach(e => e.classList.remove('active'));
        const el = document.getElementById(`item-${id}`);
        if(el) {
            el.classList.add('active');
            el.scrollIntoView({ behavior: 'smooth', block: 'center' });
        }

        if(window.myGlobe) {
            const shop = shops.find(s => s.id === id);
            if(shop) {
                window.myGlobe.pointOfView({ lat: shop.lat, lng: shop.lng, altitude: 1.5 }, 1500);
            }
        }
    };

    // --- 5. INITIALISATION GLOBE AVEC JOUR/NUIT SUR FOND BLANC ---
    let sunLight;

    function initGlobe() {
        const container = document.getElementById('globe-area');
        if (!container) return;
        
        document.getElementById('loading-msg').style.display = 'none';

        try {
            window.myGlobe = Globe()
                (document.getElementById('globeViz'))
                .backgroundColor('#ffffff') // FOND BLANC
                .globeImageUrl('//unpkg.com/three-globe/example/img/earth-blue-marble.jpg')
                .showAtmosphere(true)
                .atmosphereColor("#7d1d26")
                .atmosphereAltitude(0.15)
                .width(container.clientWidth)
                .height(container.clientHeight)
                
                // POINTS CONFIGURATION DEMANDÉE
                .pointsData(shops)
                .pointLat('lat')
                .pointLng('lng')
                .pointColor(d => getStatus(d).color)
                .pointAltitude(0.02) // ALTITUDE DEMANDÉE
                .pointRadius(0.7)    // RAYON DEMANDÉ (Valeur de base)
                .pointsMerge(false)
                .pointLabel(null) 
                
                // INTERACTION
                .onPointClick(d => window.activateShop(d.id))
                .onPointHover((d, prevPoint) => {
                    const tooltip = document.getElementById('custom-tooltip');
                    const canvas = document.getElementById('globeViz');
                    
                    if (d) {
                        canvas.style.cursor = 'pointer';
                        
                        // Contenu du tooltip
                        const st = getStatus(d);
                        tooltip.style.display = 'block';
                        tooltip.innerHTML = `
                            <div class="tt-meta">${d.country}</div>
                            <h3>${d.name}</h3>
                            <div class="tt-status" style="color:${st.color}">${st.text} - ${st.time}</div>
                        `;
                    } else {
                        canvas.style.cursor = 'default';
                        tooltip.style.display = 'none';
                    }
                });

            // --- LUMIÈRE SOLAIRE (CONTRASTE FORT POUR FOND BLANC) ---
            // On réduit l'ambient light pour que l'ombre soit visible
            const ambient = new THREE.AmbientLight(0xffffff, 0.2); 
            window.myGlobe.scene().add(ambient);

            // Soleil directionnel puissant
            sunLight = new THREE.DirectionalLight(0xffffff, 2.5);
            window.myGlobe.scene().add(sunLight);

            // Matériau pour recevoir les ombres
            const globeMaterial = window.myGlobe.globeMaterial();
            globeMaterial.color = new THREE.Color(0xffffff);
            globeMaterial.shininess = 0.5;

            // --- ROTATION INTELLIGENTE ---
            // 1. Configuration de base
            window.myGlobe.controls().autoRotate = true;
            window.myGlobe.controls().autoRotateSpeed = 0.6;

            // 2. Gestionnaires d'événements
            const globeDiv = document.getElementById('globeViz'); // On cible le div du globe, pas le wrapper général

            globeDiv.addEventListener('mouseenter', () => {
                if (window.myGlobe) {
                    window.myGlobe.controls().autoRotate = false;
                }
            });

            globeDiv.addEventListener('mouseleave', () => {
                if (window.myGlobe) {
                    window.myGlobe.controls().autoRotate = true;
                }
            });

            // Positionnement du tooltip
            globeDiv.addEventListener('mousemove', (e) => {
                const tooltip = document.getElementById('custom-tooltip');
                if(tooltip.style.display === 'block') {
                    // On prend les coordonnées relatives à la fenêtre ou au parent
                    // Ici on utilise clientX/Y qui suit la souris
                    tooltip.style.left = (e.clientX + 15) + 'px';
                    tooltip.style.top = (e.clientY + 15) + 'px';
                }
            });

            updateSunPosition();

        } catch (e) {
            console.error("Globe failed", e);
        }
    }

    // --- 6. CALCUL POSITION SOLEIL ---
    function updateSunPosition() {
        if (!sunLight) return;
        
        const now = new Date();
        const utcHours = now.getUTCHours();
        const utcMinutes = now.getUTCMinutes();
        
        // Formule : Le soleil se déplace de 15° par heure vers l'Ouest
        const sunLongitude = (12 - (utcHours + utcMinutes / 60)) * 15;
        
        const phi = (90 - 0) * (Math.PI / 180); // Latitude 0 (Equateur)
        const theta = (sunLongitude + 180) * (Math.PI / 180); 
        
        const distance = 200;
        sunLight.position.x = -distance * Math.sin(phi) * Math.cos(theta);
        sunLight.position.y = distance * Math.cos(phi);
        sunLight.position.z = distance * Math.sin(phi) * Math.sin(theta);
    }

    // --- 7. HORLOGE & UPDATE ---
    function updateClock() {
        const now = new Date();
        const h = String(now.getUTCHours()).padStart(2, '0');
        const m = String(now.getUTCMinutes()).padStart(2, '0');
        const el = document.getElementById('utc-clock');
        if(el) el.innerText = `${h}:${m} UTC`;
        
        updateSunPosition();
    }

    // --- 8. DÉMARRAGE ---
    renderList();
    updateClock();
    setInterval(updateClock, 1000); 
    
    setInterval(() => {
        renderList(); 
        if(window.myGlobe) window.myGlobe.pointColor(window.myGlobe.pointColor()); 
    }, 60000);

    setTimeout(initGlobe, 500);

    window.addEventListener('resize', () => {
        if(window.myGlobe) {
            const c = document.getElementById('globe-area');
            window.myGlobe.width(c.clientWidth);
            window.myGlobe.height(c.clientHeight);
        }
    });

</script>
</body>
