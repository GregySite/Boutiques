    <style>
        /* --- DESIGN SYSTEM VAN CLEEF & ARPELS --- */
        :root {
            --vca-main: #111111; 
            --vca-gold: #a68966; 
            --vca-bg: #ffffff;
            --text-light: #767676;
            --border-color: #e5e5e5;
            --font-serif: 'Playfair Display', serif; 
            --font-sans: 'Lato', sans-serif;
        }

        html, body { 
            margin: 0; padding: 0; 
            width: 100%; height: 100%; 
            background-color: var(--vca-bg); 
            font-family: var(--font-sans); 
            color: var(--vca-main);
            overflow: hidden; 
            display: flex; 
        }

        /* --- SIDEBAR --- */
        #sidebar {
            width: 360px;
            min-width: 360px;
            background: #fff;
            border-right: 1px solid var(--border-color);
            display: flex;
            flex-direction: column;
            z-index: 20;
            height: 100vh;
            box-shadow: 2px 0 15px rgba(0,0,0,0.03);
        }

        .header {
            padding: 30px 20px 20px;
            background: #fff;
            text-align: center;
            border-bottom: 2px solid var(--vca-main);
        }
        
        #logo-img {
            display: block; margin: 0 auto;
            max-width: 160px; height: auto;
        }
        
        .subtitle {
            font-family: var(--font-serif);
            font-style: italic;
            color: var(--vca-main);
            font-size: 1.1em;
            margin-top: 15px;
            letter-spacing: 1px;
        }

        #list-container {
            flex: 1;
            overflow-y: auto;
            background: #fff;
            position: relative;
            scroll-behavior: smooth;
        }
        #list-container::-webkit-scrollbar { width: 4px; }
        #list-container::-webkit-scrollbar-thumb { background: #ccc; border-radius:2px; }

        /* ITEM LISTE */
        .shop-item {
            padding: 18px 24px;
            border-bottom: 1px solid #f0f0f0;
            cursor: pointer;
            display: flex; 
            justify-content: space-between; 
            align-items: center;
            transition: all 0.3s ease;
        }
        .shop-item:hover { background: #fafafa; padding-left: 28px; }
        
        .shop-item.active { 
            background: #f9f9f9; 
            border-left: 4px solid var(--vca-main); 
            padding-left: 24px; 
        }
        .shop-item.active .si-timer { color: var(--vca-main); font-weight: 600; }

        .si-info { display: flex; flex-direction: column; }
        .si-country { font-size: 0.7em; color: #999; font-weight: 700; text-transform: uppercase; margin-bottom: 4px; letter-spacing: 1.5px; }
        .si-name { font-family: var(--font-serif); font-size: 1.2em; color: #000; }
        .si-status { text-align: right; }
        .si-time { font-family: var(--font-sans); font-weight: 300; font-size: 1.2em; color: #333; margin-bottom: 2px; }
        .si-timer { font-size: 0.75em; color: #aaa; margin-bottom: 6px; font-style: italic; font-family: var(--font-serif); }
        
        .badge {
            display: inline-block; padding: 4px 8px; border-radius: 0;
            font-size: 0.65em; font-weight: 700; text-transform: uppercase; letter-spacing: 1px;
            border: 1px solid transparent;
        }
        
        .b-open { color: #fff; background: var(--vca-main); }
        .b-closed { color: #1e8e3e; background: #f4fbf6; border: 1px solid #d4edda; }

        /* --- GLOBE AREA --- */
        #globe-area {
            flex-grow: 1;
            position: relative;
            background: #ffffff;
            width: 100%;
            overflow: hidden;
        }

        #utc-clock {
            position: absolute; top: 30px; right: 30px;
            color: #333; font-family: var(--font-serif); font-size: 1.5em; 
            z-index: 50; background: rgba(255,255,255,0.95);
            padding: 12px 25px; border: 1px solid #ddd;
            box-shadow: 0 5px 15px rgba(0,0,0,0.1);
        }
        
        #loading-msg {
            position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%);
            color: #aaa; font-family: var(--font-sans); pointer-events: none; letter-spacing: 2px;
        }

        #copyright {
            position: absolute; bottom: 15px; right: 20px;
            color: #aaa; font-size: 0.7em; pointer-events: none; z-index: 50;
            font-family: var(--font-sans); letter-spacing: 1px;
        }

        #custom-tooltip {
            position: absolute;
            display: none;
            background: #fff;
            border-left: 3px solid var(--vca-main);
            padding: 15px 20px;
            pointer-events: none;
            z-index: 100;
            color: #333;
            box-shadow: 0 10px 30px rgba(0,0,0,0.15);
            font-family: var(--font-sans);
            min-width: 150px;
        }
        #custom-tooltip h3 {
            margin: 0 0 5px 0;
            font-family: var(--font-serif);
            font-size: 1.1em;
            color: #000;
        }
        #custom-tooltip .tt-meta { font-size: 0.8em; color: #888; text-transform: uppercase; margin-bottom: 8px; }
        #custom-tooltip .tt-status { font-weight: bold; font-size: 0.85em; }
    </style>

    // --- 2. STATUS LOGIC ---
    function getStatus(shop) {
        try {
            const now = new Date();
            const localDateString = now.toLocaleString("en-GB", {timeZone: shop.tz});
            // Re-parse it manually to get exact local values securely
            const tzDateStr = new Intl.DateTimeFormat('en-US', {
                timeZone: shop.tz,
                year: 'numeric', month: 'numeric', day: 'numeric',
                hour: 'numeric', minute: 'numeric', second: 'numeric', hour12: false
            }).format(now);
            
            const localDate = new Date(tzDateStr);
            const day = localDate.getDay(); 
            const h = localDate.getHours() + (localDate.getMinutes() / 60);
            const isOff = shop.daysOff.includes(day);
            const isOpen = !isOff && h >= shop.open && h < shop.close;

            let diffMinutes = 0;
            let label = isOpen ? "Closes in" : "Opens in";
            if (isOpen) {
                diffMinutes = (shop.close - h) * 60;
            } else {
                if (!isOff && h < shop.open) diffMinutes = (shop.open - h) * 60;
                else diffMinutes = (24 - h + shop.open) * 60;
            }

            const hh = String(localDate.getHours()).padStart(2,'0');
            const mm = String(localDate.getMinutes()).padStart(2,'0');
            const timerH = Math.floor(diffMinutes / 60); 
            const timerM = Math.floor(diffMinutes % 60);

            return {
                isOpen, 
                text: isOpen ? "OPEN" : "CLOSED",
                class: isOpen ? "b-open" : "b-closed",
                color: isOpen ? "#111111" : "#1e8e3e",
                time: `${hh}:${mm}`,
                timerLabel: label,
                timerVal: `${timerH}h ${String(timerM).padStart(2, '0')}m`
            };
        } catch (e) { return { isOpen: false, text: "ERR", color: "grey", time: "--:--" }; }
    }

    // --- 3. RENDER LIST ---
    function renderList() {
        const container = document.getElementById('list-container');
        if(!container) return;
        container.innerHTML = "";
        shops.forEach(shop => {
            const st = getStatus(shop);
            const div = document.createElement('div');
            div.className = "shop-item";
            div.id = `item-${shop.id}`;
            div.onclick = function() { window.activateShop(shop.id); };
            div.innerHTML = `
                <div class="si-info">
                    <span class="si-country">${shop.country}</span>
                    <span class="si-name">${shop.name}</span>
                </div>
                <div class="si-status">
                    <div class="si-time">${st.time}</div>
                    <div class="si-timer">${st.timerLabel} ${st.timerVal}</div>
                    <div class="badge ${st.class}">${st.text}</div>
                </div>
            `;
            container.appendChild(div);
        });
    }

    // --- 4. ACTIVATE & SCROLL ---
    window.activateShop = function(id) {
        document.querySelectorAll('.shop-item').forEach(e => e.classList.remove('active'));
        const el = document.getElementById(`item-${id}`);
        if(el) {
            el.classList.add('active');
            el.scrollIntoView({ behavior: 'smooth', block: 'center' });
        }
        if(window.myGlobe) {
            const shop = shops.find(s => s.id === id);
            if(shop) window.myGlobe.pointOfView({ lat: shop.lat, lng: shop.lng, altitude: 1.5 }, 1500);
        }
    };

    // --- 5. GLOBE INIT ---
    function initGlobe() {
        const container = document.getElementById('globe-area');
        document.getElementById('loading-msg').style.display = 'none';

        window.myGlobe = Globe()
            (document.getElementById('globeViz'))
            .backgroundColor('#ffffff')
            .globeImageUrl('//unpkg.com/three-globe/example/img/earth-blue-marble.jpg')
            .showAtmosphere(true)
            .atmosphereColor("#a68966")
            .atmosphereAltitude(0.15)
            .width(container.clientWidth)
            .height(container.clientHeight)
            .pointsData(shops)
            .pointLat('lat').pointLng('lng')
            .pointColor(d => getStatus(d).color)
            .pointAltitude(0.05)
            .pointRadius(0.8)
            .onPointClick(d => window.activateShop(d.id))
            .onPointHover((d) => {
                const tooltip = document.getElementById('custom-tooltip');
                const canvas = document.getElementById('globeViz');
                if (d) {
                    canvas.style.cursor = 'pointer';
                    const st = getStatus(d);
                    tooltip.style.display = 'block';
                    tooltip.innerHTML = `
                        <div class="tt-meta">${d.country}</div>
                        <h3>${d.name}</h3>
                        <div style="font-weight:bold;color:${st.color}">${st.text} - ${st.time}</div>
                    `;
                } else {
                    canvas.style.cursor = 'default';
                    tooltip.style.display = 'none';
                }
            });

        const ambient = new THREE.AmbientLight(0xffffff, 0.4); 
        window.myGlobe.scene().add(ambient);
        const sun = new THREE.DirectionalLight(0xffffff, 2.2);
        sun.position.set(1, 1, 1);
        window.myGlobe.scene().add(sun);

        window.myGlobe.controls().autoRotate = true;
        window.myGlobe.controls().autoRotateSpeed = 0.5;

        // Tooltip follow mouse
        document.getElementById('globeViz').addEventListener('mousemove', (e) => {
            const tooltip = document.getElementById('custom-tooltip');
            tooltip.style.left = (e.clientX + 15) + 'px';
            tooltip.style.top = (e.clientY + 15) + 'px';
        });
    }

    // --- 6. INITIALIZATION ---
    renderList();
    setInterval(() => {
        const now = new Date();
        const h = String(now.getUTCHours()).padStart(2, '0');
        const m = String(now.getUTCMinutes()).padStart(2, '0');
        document.getElementById('utc-clock').innerText = `${h}:${m} UTC`;
    }, 1000);

    setTimeout(initGlobe, 500);

    window.addEventListener('resize', () => {
        if(window.myGlobe) {
            const c = document.getElementById('globe-area');
            window.myGlobe.width(c.clientWidth).height(c.clientHeight);
        }
    });
</script>
</body>
</html>
